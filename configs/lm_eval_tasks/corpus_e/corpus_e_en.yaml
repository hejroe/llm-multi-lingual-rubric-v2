# corpus_e (Set E, Contamination-Check Set, RQ6): perturbed twins of Set A
# items, run alongside their originals (corpus_a_knowledge_en/_de).
# corpus-v0.3 (2026-09-15): set_e.csv gained a `language` column and
# German rows, so this task now needs process_docs to filter to English
# only — previously "the whole file is one task" since it was English-only.
task: corpus_e_en
dataset_path: csv
dataset_kwargs:
  data_files: /corpus/v0.3/set_e.csv
test_split: train
process_docs: !function utils.filter_en
output_type: generate_until
target_delimiter: ""
doc_to_text: '{{"Question: "+question_text+"\nAnswer:"}}'
doc_to_target: '{{gold_answer}}'
generation_kwargs:
  until:
    - "Question:"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 2048
filter_list:
  - name: take_first
    filter:
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 0.2
