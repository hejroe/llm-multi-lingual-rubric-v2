# Convenience wrapper around the Dockerfile for repeated runs.
#
# Usage (from the docker/ directory):
#   docker compose build
#   docker compose run --rm eval bash scripts/check_ollama_connectivity.sh
#   docker compose run --rm eval lm_eval --model local-chat-completions \
#     --model_args base_url=http://host.docker.internal:11434/v1/chat/completions,model=llama3.2:1b,num_concurrent=1 \
#     --tasks mmlu_prox_en_biology --limit 5 --output_path /results/smoke_test_mmlu_prox_en
#
# host.docker.internal wiring (verified end-to-end 2026-09-12): the
# `extra_hosts: host.docker.internal: host-gateway` shortcut that works under
# Docker Desktop does NOT reach a Windows-native Ollama under native Docker
# Engine on WSL2 — "host-gateway" there resolves to the container's own
# docker0 bridge gateway on the WSL2 Linux VM, which has nothing listening on
# it; Ollama is on Windows, one hop further away. Getting there requires BOTH:
#   1. WSL2 "mirrored" networking (%USERPROFILE%\.wslconfig: [wsl2]
#      networkingMode=mirrored, then `wsl --shutdown`), which makes WSL2's own
#      localhost forward to Windows' localhost and vice versa; and
#   2. `network_mode: host` below, so this container shares WSL2's network
#      namespace directly instead of sitting behind the docker0 bridge, where
#      that localhost-forwarding trick does not apply.
# With both in place, `host.docker.internal` is mapped straight to 127.0.0.1
# via extra_hosts (not host-gateway) and resolves correctly. Also requires
# Ollama bound to 0.0.0.0 (OLLAMA_HOST=0.0.0.0), not the 127.0.0.1-only
# default, and a Windows Firewall inbound allow rule for TCP 11434 (classic
# Windows Firewall, not the separate Hyper-V VM Firewall some WSL2 builds use
# for the old NAT-mode vEthernet adapter — mirrored mode sidesteps that
# entirely, which is the other reason it's used here over a firewall-only fix).
#
# Ollama itself runs natively on Windows, not as a service in this file — see
# docs/STUDY_PROTOCOL.md Section 9.2 for why.
#
# The `llamacpp` service below is the one exception: it DOES run
# containerised, with GPU passthrough, because — unlike Ollama — it has no
# separate native-Windows install path and this project's Set D (RQ4,
# tool-calling) specifically needs its OpenAI-compatible tool-calling support
# (docs/adr/0001-inference-backend-abstraction.md). Closes the gap tracked in
# docs/STUDY_PROTOCOL.md Section 12.10. Because `eval` now runs with
# `network_mode: host` (above), it can no longer resolve `llamacpp` by compose
# service-name DNS (host networking bypasses the compose bridge network
# entirely) — reach it via its published port instead: http://localhost:8081
# (see `scripts/check_llamacpp_connectivity.sh`).
#
# Run one backend at a time: this project's target hardware has 8GB VRAM
# (per its original scoping), and Ollama (native) and `llamacpp` (this
# service) both want the GPU. They are not designed to serve requests
# concurrently — stop the Ollama-serving runs before starting a Set D run
# against `llamacpp`, not the other way round.
services:
  eval:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: llm-eval-pilot
    volumes:
      - ../results:/results
      - ../configs:/configs
      - ../scripts:/home/runner/scripts
      - ../corpus:/corpus:ro
    network_mode: host
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    working_dir: /home/runner

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    volumes:
      - ../models:/models
    # Point -m at whichever GGUF file you've placed in ../models — see
    # models/README.md for how to obtain one matching a registered
    # candidate (docs/MODEL_REGISTER.md). --jinja is required for
    # OpenAI-style tool/function calling (llama.cpp server docs,
    # docs/function-calling.md) — without it, Set D's tool-choice
    # requests will not work even though the endpoint otherwise responds.
    command: >
      -m /models/model.gguf
      --host 0.0.0.0 --port 8080
      --jinja
      --n-gpu-layers 999
    ports:
      - "8081:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
